<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: a personal game log. Sticky HUD header with tabs, one content column (max 1080px), cover-art grids generated from each title. */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --line:#DADDE5;
  --ink:#15171C; --muted:#5E6371; --faint:#8C91A0;
  --accent:#2E57F0; --accent-ink:#FFFFFF; --accent-soft:#E3E9FE;
  --star:#E89A00; --star-off:#D3D6DE;
  --ok:#1C8A55; --warn:#B86E00; --bad:#C23A3A; --info:#2E57F0; --gold:#9A6B00;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.06);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1015; --surface:#161920; --surface-2:#1C2029; --line:#2A2F3B;
  --ink:#E9EBF1; --muted:#A3A8B6; --faint:#737988;
  --accent:#7D95FF; --accent-ink:#0E1015; --accent-soft:#1F2744;
  --star:#FFC247; --star-off:#383D4A;
  --ok:#4CC98A; --warn:#F0A43A; --bad:#F07272; --info:#7D95FF; --gold:#FFC247;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1015; --surface:#161920; --surface-2:#1C2029; --line:#2A2F3B;
  --ink:#E9EBF1; --muted:#A3A8B6; --faint:#737988;
  --accent:#7D95FF; --accent-ink:#0E1015; --accent-soft:#1F2744;
  --star:#FFC247; --star-off:#383D4A;
  --ok:#4CC98A; --warn:#F0A43A; --bad:#F07272; --info:#7D95FF; --gold:#FFC247;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* header */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.hud-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 13px var(--f-display);flex:none}
.brand-name{font:700 19px var(--f-display);white-space:nowrap}
.brand-owner{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 11px;font:600 14px var(--f-display);letter-spacing:.03em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:22px 64px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:17px}
.sec-head .hint{color:var(--muted);font-size:13px}

.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* profile hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.avatar{width:76px;height:76px;border-radius:16px;display:grid;place-items:center;font:700 32px var(--f-display);color:#fff;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#000))}
.hero h1{font-size:30px;line-height:1.1}
.hero p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.statline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat b{display:block;font:500 22px var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* covers */
.cover{--h:220;position:relative;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;
  background:
   radial-gradient(120% 70% at 100% 0%,hsl(calc(var(--h) + 50) 85% 62% / .55),transparent 60%),
   linear-gradient(165deg,hsl(var(--h) 58% 44%),hsl(calc(var(--h) + 30) 62% 18%));
  color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px);pointer-events:none}
.cv-plat{position:absolute;top:8px;left:8px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px}
.cv-title{font:700 15px/1.1 var(--f-display);text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.35);overflow-wrap:anywhere}
.cv-rank{position:absolute;top:8px;right:8px;font:700 12px var(--f-display);background:rgba(0,0,0,.4);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.has-img::before{display:none}
.cv-plat,.cv-rank{z-index:1}
.cover-pick{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;border:1.5px dashed var(--line);border-radius:var(--r);padding:12px;transition:border-color .15s,background .15s}
.cover-pick.drag{border-color:var(--accent);background:var(--accent-soft)}
.cover-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.cover-actions .hint{font-size:13px;color:var(--muted)}
.cover-btns{display:flex;gap:6px;flex-wrap:wrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cover-edit{display:flex;flex-direction:column;gap:8px;align-items:stretch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.top4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .cover{transition:transform .15s ease}
.card:hover .cover{transform:translateY(-2px)}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:20px}
.card-name{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-empty{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--faint);font-size:13px;text-align:center;padding:8px}

/* stars */
.stars{position:relative;display:inline-block;font-size:13px;letter-spacing:1px;line-height:1;color:var(--star-off);white-space:nowrap}
.stars::after{content:"★★★★★";position:absolute;left:0;top:0;width:var(--r,0%);overflow:hidden;color:var(--star)}
.stars.lg{font-size:22px}
.rater{display:inline-flex;align-items:center}
.half{border:0;padding:0;background:none;width:.5em;overflow:hidden;font-size:28px;line-height:1;color:var(--star-off);cursor:pointer}
.half span{display:inline-block;width:1em}
.half.r span{margin-left:-.5em}
.half.on{color:var(--star)}
.rater:hover .half{color:var(--star)}
.rater .half:hover ~ .half{color:var(--star-off)}
.rate-val{font:500 13px var(--f-mono);color:var(--muted);margin-left:8px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.s-playing{--c:var(--info)} .s-backlog{--c:var(--muted)} .s-wishlist{--c:var(--gold)}
.s-played{--c:var(--faint)} .s-beaten{--c:var(--ok)} .s-completed{--c:var(--ok)} .s-shelved{--c:var(--warn)} .s-abandoned{--c:var(--bad)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-weight:500;opacity:.7;margin-left:4px}
.tag{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 7px}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px;min-width:0}
.search{flex:1;min-width:160px}

/* reviews + activity */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .cover{padding:0;border-radius:5px}
.row .cover .cv-plat,.row .cover .cv-title{display:none}
.row-main{min-width:0}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reviews{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.review{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.review:hover{border-color:var(--faint)}
.review .cover{padding:0;border-radius:6px}
.review .cover .cv-title,.review .cover .cv-plat{display:none}
.review-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.review-text{margin:0;color:var(--ink);font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.spoiler{filter:blur(5px);user-select:none;cursor:pointer}

/* journal */
.month{font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 14px 6px}
.j-date{font:500 12px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}

/* up next */
.pick{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:18px;align-items:center}
.pick h3{font-size:24px}
.pick-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:6px}
.rolling .cover{animation:roll .5s ease}
@keyframes roll{0%{transform:rotateY(0) scale(.96)}50%{transform:rotateY(90deg) scale(.96)}100%{transform:rotateY(0) scale(1)}}
.prio{font:500 12px var(--f-mono);color:var(--gold)}

/* stats */
.bars{display:flex;flex-direction:column;gap:8px;padding:16px}
.bar-row{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar-row .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bar-track{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px}
.bar-row .bv{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hist{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;height:150px;padding:16px 16px 0}
.hist-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.hist-bar{width:100%;background:var(--star);border-radius:3px 3px 0 0;min-height:2px}
.hist-n{font:500 11px var(--f-mono);color:var(--muted)}
.hist-x{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:6px 16px 14px;font:500 11px var(--f-mono);color:var(--faint);text-align:center;border-top:1px solid var(--line);margin:0 16px;padding-inline:0}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:16px 16px 10px;background:var(--surface-2)}
.stack span{background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 16px;font-size:13px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel h3{font-size:14px;padding:14px 16px 0}

/* empty */
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:17px}

/* dialogs */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,10,16,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 26px)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:18px;flex:1;min-width:0}
.dlg-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field .input{width:100%}
textarea.input{resize:vertical;min-height:90px;line-height:1.5}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.rate-row{display:flex;align-items:center;gap:12px}
.rate-row input{flex:1}

.detail{display:grid;grid-template-columns:140px 1fr;gap:18px}
.detail h2{font-size:24px}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
.time{display:flex;flex-direction:column;gap:7px}
.time .bar-row{grid-template-columns:96px 1fr 64px}
.time .bar-fill.you{background:var(--star)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.review-full{white-space:pre-wrap;margin:0;font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:50;box-shadow:var(--shadow)}

@media (max-width:760px){
  .statline{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat:nth-child(4){border-left:0}
  .stat:nth-child(n+4){border-top:1px solid var(--line)}
  .reviews,.two{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
  .top4{gap:8px}
  .top4 .cv-title{font-size:12px}
}
@media (max-width:520px){
  .hero{grid-template-columns:1fr}
  .avatar{width:56px;height:56px;font-size:24px}
  .hero h1{font-size:24px}
  .pick,.detail{grid-template-columns:1fr}
  .pick .cover,.detail .cover{max-width:140px}
  .form{grid-template-columns:1fr}
  .bar-row{grid-template-columns:84px 1fr 48px}
  .brand-owner{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.has-img::before{display:none}
.cv-plat,.cv-rank{z-index:1}
.cover-pick{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;border:1.5px dashed var(--line);border-radius:var(--r);padding:12px;transition:border-color .15s,background .15s}
.cover-pick.drag{border-color:var(--accent);background:var(--accent-soft)}
.cover-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.cover-actions .hint{font-size:13px;color:var(--muted)}
.cover-btns{display:flex;gap:6px;flex-wrap:wrap}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.cand{border:2px solid transparent;border-radius:8px;padding:0;background:none;overflow:hidden}
.cand[aria-pressed="true"]{border-color:var(--accent)}
.cand .cover{border-radius:6px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cover-edit{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.rater{display:inline-flex;align-items:center}
.half{border:0;padding:0;background:none;width:.5em;overflow:hidden;font-size:28px;line-height:1;color:var(--star-off);cursor:pointer}
.half span{display:inline-block;width:1em}
.half.r span{margin-left:-.5em}
.half.on{color:var(--star)}

<script>
(() => {
const STATUSES = [
  {k:'playing',l:'Playing'},{k:'backlog',l:'Backlog'},{k:'wishlist',l:'Wishlist'},
  {k:'played',l:'Played'},{k:'beaten',l:'Beaten'},{k:'completed',l:'Completed 100%'},{k:'shelved',l:'Shelved'},{k:'abandoned',l:'Abandoned'},
];
const PLAYED = ['played','beaten','completed','shelved','abandoned'];
const SLABEL = Object.fromEntries(STATUSES.map(s=>[s.k,s.l]));
const PLATFORMS = ['PC','PlayStation 5','PlayStation 4','Xbox Series X|S','Xbox One','Nintendo Switch','Nintendo Switch 2','Steam Deck','Mobile','Retro'];
const TABS = [{k:'profile',l:'Profile'},{k:'library',l:'Library'},{k:'tiers',l:'Tier List'},{k:'journal',l:'Journal'},{k:'next',l:'Up Next'},{k:'stats',l:'Stats'}];
const TIERS = [['S','#ff6b6b'],['A','#ffa94d'],['B','#ffd43b'],['C','#8ce99a'],['D','#74c0fc'],['F','#b197fc']];
const LOCAL_KEY = 'savefile.data.v1';

const sb = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const DEMO = !sb;

const S = {
  games:[], profile:{name:'',bio:''}, session:null, preview:false, loaded:false, loadErr:false,
  tab: (TABS.some(t=>'#'+t.k===location.hash) ? location.hash.slice(1) : 'profile'),
  lib:{shelf:'all', q:'', sort:'updated', tag:'', plat:'', genre:''},
  next:{budget:'any', plat:''}, pickId:null,
};
try{ const s=JSON.parse(localStorage.getItem('sf.lib')||'null'); if(s) Object.assign(S.lib,s,{q:''}); }catch(e){}
const isOwner = () => DEMO || !!S.session;
const VG = () => (isOwner() && !S.preview) ? S.games : S.games.filter(g=>!g.hidden);
const canWrite = () => isOwner() && !S.preview;

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = s => { let h=7; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return h; };
const fmtH = h => { h=+h||0; return h>=100? Math.round(h)+'h' : (Math.round(h*10)/10)+'h'; };
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = d => { if(!d) return ''; const x=new Date(d+'T12:00:00'); if(isNaN(x)) return ''; return x.toLocaleDateString(undefined,{month:'short',day:'numeric',year: x.getFullYear()===new Date().getFullYear()?undefined:'numeric'}); };
const totalHours = g => (+g.hours||0) + (g.sessions||[]).reduce((a,s)=>a+(+s.h||0),0);
const shortPlat = p => ({'PlayStation 5':'PS5','PlayStation 4':'PS4','Xbox Series X|S':'Xbox','Xbox One':'Xbox One','Nintendo Switch':'Switch','Nintendo Switch 2':'Switch 2','Steam Deck':'Deck'}[p]||p||'');
const stars = (r,lg) => r==null||r===''? '' : `<span class="stars${lg?' lg':''}" style="--r:${(+r)*10}%" role="img" aria-label="${(+r)/2} out of 5 stars">★★★★★</span>`;
const pill = st => `<span class="pill s-${esc(st)}">${esc(SLABEL[st]||st)}</span>`;
const newId = () => 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const byId = id => S.games.find(g=>g.id===id);
const decodeEnt = t => { const el=document.createElement('textarea'); el.innerHTML=String(t||''); return el.value; };
const STEAM_IMG = (id,f) => `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${encodeURIComponent(id)}/${f}`;

// Grids use Steam's 300x450 art; the game page uses the 600x900 version.
function coverSrc(g, big){
  if(g.img){
    if(!big && /library_capsule_2x\.jpg/.test(g.img)) return {src:g.img.replace('library_capsule_2x.jpg','library_capsule.jpg'), fb:g.img};
    return {src:g.img, fb:''};
  }
  if(g.steam) return big ? {src:STEAM_IMG(g.steam,'library_600x900_2x.jpg'), fb:STEAM_IMG(g.steam,'header.jpg')}
                         : {src:STEAM_IMG(g.steam,'library_600x900.jpg'), fb:STEAM_IMG(g.steam,'library_600x900_2x.jpg')+'|'+STEAM_IMG(g.steam,'header.jpg')};
  return null;
}
function cover(g, rank, big){
  const c=coverSrc(g, big);
  const img = c ? `<img src="${esc(c.src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" ${c.fb?`data-fb="${esc(c.fb)}"`:''}>` : '';
  return `<div class="cover${c?' has-img':''}" style="--h:${hue(g.title)}">${img}${g.platform?`<span class="cv-plat">${esc(shortPlat(g.platform))}</span>`:''}${rank?`<span class="cv-rank">${rank}</span>`:''}<span class="cv-title">${esc(g.title)}</span></div>`;
}
// Broken cover image: try the fallback, then fall back to the generated cover.
document.addEventListener('error', e=>{
  const im=e.target; if(!(im instanceof HTMLImageElement) || !im.closest('.cover')) return;
  if(im.dataset.fb){ const [f,...rest]=im.dataset.fb.split('|'); if(rest.length) im.dataset.fb=rest.join('|'); else delete im.dataset.fb; im.src=f; return; }
  im.closest('.cover').classList.remove('has-img'); im.remove();
}, true);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }

/* ============ storage ============ */
function localLoad(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)||'null'); }catch(e){ return null; } }
function localSave(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({profile:S.profile, games:S.games})); }catch(e){ toast('This browser is out of space. Remove a few uploaded covers.'); throw e; } }
async function load(){
  if(DEMO){ const d=localLoad(); if(d){ S.games=d.games||[]; S.profile={...S.profile,...(d.profile||{})}; } S.loaded=true; render(); if(location.hash.startsWith('#g-')) detail(location.hash.slice(3)); return; }
  try{
    const [g,p] = await Promise.all([ sb.from('games').select('id,data'), sb.from('profile').select('data').eq('id',1).maybeSingle() ]);
    if(g.error) throw g.error;
    S.games = (g.data||[]).map(r=>({...(r.data||{}), id:r.id})).filter(x=>x.title);
    if(p.data?.data) S.profile={...S.profile,...p.data.data};
    S.loaded=true; S.loadErr=false;
  }catch(e){ console.error(e); S.loadErr=true; S.loaded=true; }
  render();
  if(location.hash.startsWith('#g-')) detail(location.hash.slice(3));
}
async function writeGames(list){
  if(DEMO){ localSave(); return; }
  const rows=list.map(g=>{ const {id,...data}=g; return {id, data}; });
  for(let i=0;i<rows.length;i+=200){
    const chunk=rows.slice(i,i+200);
    // Merge on the server so an older open tab can't wipe fields added since it loaded.
    const {error}=await sb.rpc('save_games',{rows:chunk});
    if(error){
      if(!/save_games|PGRST202|function/i.test(error.message||error.code||'')) throw error;
      const r=await sb.from('games').upsert(chunk.map(x=>({...x, updated_at:new Date().toISOString()}))); if(r.error) throw r.error;
    }
  }
}
async function removeGame(id){
  if(DEMO){ localSave(); return; }
  const {error}=await sb.from('games').delete().eq('id',id); if(error) throw error;
}
async function writeProfile(){
  if(DEMO){ localSave(); return; }
  const {error}=await sb.from('profile').upsert({id:1, data:S.profile}); if(error) throw error;
}
// Apply a change locally, save it, and roll back on failure.
async function commit(fn, okMsg){
  const snapshot=JSON.stringify({games:S.games, profile:S.profile});
  let op; try{ op=fn(); }catch(e){ return false; }
  render();
  const sv=$('#saving'); sv.hidden=false;
  try{ await op(); sv.hidden=true; if(okMsg) toast(okMsg); return true; }
  catch(e){
    console.error(e); sv.hidden=true;
    const snap=JSON.parse(snapshot); S.games=snap.games; S.profile=snap.profile; render();
    toast(S.session||DEMO ? 'Could not save. Check your connection and try again.' : 'Your login expired. Log in again to save.');
    return false;
  }
}
function saveGame(g, msg){ return commit(()=>{ const i=S.games.findIndex(x=>x.id===g.id); if(i<0) S.games.push(g); else S.games[i]=g; const touched=[g];
  if(+g.top){ S.games.forEach(x=>{ if(x.id!==g.id && +x.top===+g.top){ x.top=0; touched.push(x);} }); }
  return ()=>writeGames(touched); }, msg); }

/* ============ render ============ */
function render(){
  applyAccent();
  $('#brandOwner').textContent = S.profile.name ? '· '+S.profile.name : '';
  document.title = S.profile.name ? `${S.profile.name} · Save File` : 'Save File';
  $('#tabs').innerHTML = TABS.map(t=>`<button class="tab" data-tab="${t.k}" ${S.tab===t.k?'aria-current="page"':''}>${t.l}</button>`).join('');
  $('#ownerBar').innerHTML = isOwner() ? `
    <button class="btn ghost sm" data-act="preview">${S.preview?'Exit visitor view':'View as visitor'}</button>
    ${S.preview?'':'<button class="btn sm" data-act="rate">Rate games</button><button class="btn sm" data-act="log">Log session</button><button class="btn primary sm" data-act="add">+ Add game</button>'}` : '';
  $('#footAuth').innerHTML = DEMO ? '' : S.session
    ? `<button class="btn ghost sm" data-act="tools">Import / export</button><button class="btn ghost sm" data-act="logout">Log out</button>`
    : `<button class="btn ghost sm" data-act="login">Owner login</button>`;
  const app=$('#app');
  if(!S.loaded){ app.innerHTML=`<div class="empty"><strong>Loading…</strong></div>`; return; }
  if(S.loadErr){ app.innerHTML=`<div class="panel empty"><strong>Couldn't load the game log</strong><span>Reload the page to try again.</span></div>`; return; }
  const v={profile:viewProfile, library:viewLibrary, tiers:viewTiers, journal:viewJournal, next:viewNext, stats:viewStats}[S.tab]();
  const demoBanner = DEMO ? `<div class="banner warn"><span><b>Preview mode.</b> Supabase isn't connected yet, so changes save only in this browser. Finish the setup steps to publish.</span><span class="spacer"></span><button class="btn sm" data-act="tools">Import / export</button></div>` : '';
  app.innerHTML = demoBanner + (S.preview?`<div class="banner">You're seeing what visitors see.<span class="spacer"></span><button class="btn sm" data-act="preview">Back to editing</button></div>`:'') + v;
}
function emptyAll(){
  return canWrite()
    ? `<div class="panel empty"><strong>Your save file is empty</strong><span>Add a game, or import your Steam and Xbox libraries.</span><div class="toolbar" style="justify-content:center"><button class="btn primary" data-act="add">+ Add a game</button><button class="btn" data-act="tools">Import</button></div></div>`
    : `<div class="panel empty"><strong>Nothing logged yet</strong><span>Check back soon.</span></div>`;
}
function stats(){
  const G=VG(), rated=G.filter(g=>g.rating!=null&&g.rating!=='');
  return {
    played:G.filter(g=>PLAYED.includes(g.status)).length,
    finished:G.filter(g=>g.status==='beaten'||g.status==='completed').length,
    hours:G.reduce((a,g)=>a+totalHours(g),0),
    avg: rated.length? rated.reduce((a,g)=>a+ +g.rating,0)/rated.length/2 : null,
    backlog:G.filter(g=>g.status==='backlog').length,
    backlogH:G.filter(g=>g.status==='backlog').reduce((a,g)=>a+(+g.hltb?.main||0),0),
    playing:G.filter(g=>g.status==='playing'),
  };
}
function gameCard(g){
  const sel=S.selMode&&S.sel?.has(g.id);
  return `<button class="card${sel?' picked':''}${g.hidden?' is-hidden':''}" data-open="${esc(g.id)}" ${S.selMode?`aria-pressed="${!!sel}"`:''}>${cover(g)}${g.hidden&&isOwner()?'<span class="hid-tag">Hidden</span>':''}<span class="card-name">${esc(g.title)}</span><span class="card-meta">${g.rating!=null&&g.rating!==''?stars(g.rating):pill(g.status)}</span></button>`;
}
function topGenresHtml(){

function libFiltered(){
  const L=S.lib, q=L.q.trim().toLowerCase();
  const G=VG().filter(g=>{
    if(L.shelf==='played' && !PLAYED.includes(g.status)) return false;
    if(L.shelf==='reviewed' && !g.review) return false;
    if(L.shelf==='rated' && !+g.rating) return false;
    if(!['all','played','reviewed','rated'].includes(L.shelf) && g.status!==L.shelf) return false;
    if(L.tag && !(g.tags||[]).includes(L.tag)) return false;
    if(L.plat && g.platform!==L.plat) return false;
    if(L.genre && !(g.genres||[]).includes(L.genre)) return false;
    if(q && !(g.title.toLowerCase().includes(q) || (g.tags||[]).some(t=>t.toLowerCase().includes(q)) || (g.genres||[]).some(t=>t.toLowerCase().includes(q)) || String(g.developer||'').toLowerCase().includes(q))) return false;
    return true;
  });
  const sorts={updated:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0), title:(a,b)=>a.title.localeCompare(b.title), rating:(a,b)=>(+b.rating||-1)-(+a.rating||-1), hours:(a,b)=>totalHours(b)-totalHours(a),
    played:(a,b)=>(b.lastPlayed||'').localeCompare(a.lastPlayed||''), year:(a,b)=>(+b.year||0)-(+a.year||0), metacritic:(a,b)=>(+b.metacritic||0)-(+a.metacritic||0)};
  return G.sort(sorts[L.sort]||sorts.updated);
}

async function placeTier(id, tier, beforeId){
  const g=byId(id); if(!g) return;
  S.tierSel=null;

    const list=S.games.filter(x=>x.tier===tier && x.id!==id).sort((a,b)=>(+a.tierPos||0)-(+b.tierPos||0));
    const bi=beforeId?list.findIndex(x=>x.id===beforeId):-1;
    if(bi>=0){ const prev=bi>0?(+list[bi-1].tierPos||0):(+list[bi].tierPos||0)-1000; pos=(prev+(+list[bi].tierPos||0))/2; }
    else pos=(list.length?(+list[list.length-1].tierPos||0):0)+1000;
  }
  if((g.tier||'')===(tier||'') && !beforeId){ render(); return; }
  await saveGame({...g, tier:tier||'', tierPos:tier?pos:0, updatedAt:Date.now()}, tier?`${g.title} → ${tier} tier`:`${g.title} unranked`);
}

  const mmax=Math.max(1,...months);
  const plats={}; T.forEach(g=>{ const p=g.platform||'Other'; plats[p]=(plats[p]||0)+1; });
  const platTop=Object.entries(plats).sort((a,b)=>b[1]-a[1]);
  const mn=['J','F','M','A','M','J','J','A','S','O','N','D'];
  return `<section class="yir panel">

function genreBlock(G){
  const hrs={}, cnt={}, rat={};
  G.forEach(g=>(g.genres||[]).forEach(x=>{ hrs[x]=(hrs[x]||0)+totalHours(g); cnt[x]=(cnt[x]||0)+1; if(+g.rating){ (rat[x]=rat[x]||[]).push(+g.rating); } }));
  const names=Object.keys(cnt); if(!names.length) return '';
  const byH=names.map(n=>[n,hrs[n]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const byR=names.filter(n=>(rat[n]||[]).length>=2).map(n=>[n, rat[n].reduce((a,b)=>a+b,0)/rat[n].length/2]).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return `<section class="two">
    <div class="panel"><h3>Genres by hours played</h3><div class="bars">${byH.length?barRows(byH,fmtH):'<span style="color:var(--muted)">No hours yet.</span>'}</div></div>
    <div class="panel"><h3>Best-rated genres</h3><div class="bars">${byR.length?barRows(byR,v=>v.toFixed(1)+'★'):'<span style="color:var(--muted)">Rate at least two games in a genre to see this.</span>'}</div></div>
  </section>`;
}

/* ============ cover tools ============ */
function imgToCover(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type||'')) return rej(new Error('type'));
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const W=360,H=480,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
      const s=Math.max(W/im.naturalWidth,H/im.naturalHeight), w=im.naturalWidth*s, h=im.naturalHeight*s;
      x.fillStyle='#111'; x.fillRect(0,0,W,H); x.drawImage(im,(W-w)/2,(H-h)/2,w,h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.8)); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('load')); };
    im.src=url;
  });
}
// Official Steam box art, looked up by title through the database (Steam blocks direct browser lookups).
const NOT_GAME = /soundtrack|costume|\bdemo\b|\bdlc\b|season pass|artbook|art book|upgrade|unlock|\bpack\b|bundle|playtest|dedicated server|\bost\b|skin/i;
async function findCovers(title){
  if(!sb) throw new Error('offline');
  const {data,error}=await sb.rpc('find_games',{q:title});
  if(error) throw error;
  const items=(data||[]).filter(i=>i&&i.id&&!NOT_GAME.test(i.name));
  return items.slice(0,6).map(i=>({steam:String(i.id), label:i.name}));
}
const steamIdFrom = s => (String(s||'').match(/(?:app\/|apps\/)(\d+)/)||[])[1] || (/^\d+$/.test(String(s||'').trim())?String(s).trim():'');
let onPasteImage=null;
document.addEventListener('paste', e=>{
  if(!onPasteImage||!dlg.open) return;
  const f=[...(e.clipboardData?.items||[])].find(i=>i.kind==='file'&&/^image\//.test(i.type))?.getAsFile();
  if(f){ e.preventDefault(); onPasteImage(f); }
});
function wireDrop(el, handler){
  if(!el) return;
  el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('drag'); });
  el.addEventListener('dragleave',()=>el.classList.remove('drag'));
  el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('drag'); const f=e.dataTransfer?.files?.[0]; if(f) handler(f); });
}

async function submitGame(id, fd, img, steam){
  const title=(fd.get('title')||'').trim();
  if(!title){ const p=$('#formErr'); p.textContent='Add a title to save this game.'; p.hidden=false; return; }
  const n=v=>{const x=parseFloat(v); return isFinite(x)&&x>=0?x:null;};
  const prev=id?byId(id):null, rating=+fd.get('rating'), status=fd.get('status');
  if(!img && !steam && !prev){ try{ const c=await Promise.race([findCovers(title), new Promise((_,r)=>setTimeout(()=>r(),3000))]); if(c?.[0]) steam=c[0].steam; }catch(_){} }
  const g={ ...(prev||{}), id: id||newId(),
    title, platform:(fd.get('platform')||'').trim(), status, rating: rating||null,
    review:(fd.get('review')||'').trim(), spoiler:fd.get('spoiler')==='on',
    hours:n(fd.get('hours')), year:n(fd.get('year')),
    hltb:{main:n(fd.get('main')), extra:n(fd.get('extra')), comp:n(fd.get('comp'))},
    started:fd.get('started')||'', finished:fd.get('finished')||'',
    top:+fd.get('top')||0, priority:+fd.get('priority')||2,
    tags:(fd.get('tags')||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,20),
    sessions:prev?.sessions||[], img:img||'', steam:steam||'', hidden:fd.get('hidden')==='on',
    createdAt:prev?.createdAt||Date.now(), updatedAt:Date.now() };
  if(!g.finished && (status==='beaten'||status==='completed') && !(prev&&(prev.status==='beaten'||prev.status==='completed'))) g.finished=today();
  if(!g.started && status==='playing') g.started=today();
  closeDlg();
  await saveGame(g, id?'Saved':'Added '+title);
}

function imgToSquare(file,size){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type||'')) return rej(new Error('type'));
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const c=document.createElement('canvas'); c.width=size; c.height=size; const x=c.getContext('2d');
      const s=Math.max(size/im.naturalWidth,size/im.naturalHeight), w=im.naturalWidth*s, h=im.naturalHeight*s;
      x.drawImage(im,(size-w)/2,(size-h)/2,w,h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.85)); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('load')); };
    im.src=url;
  });
}

    if(!incoming.length){ msg.textContent='No games found in that file.'; return; }
    const norm=t=>String(t).toLowerCase().replace(/[^a-z0-9]/g,'');
    let added=0, updated=0; const touched=[];
    const next=S.games.map(g=>({...g}));
    for(const inc of incoming){
      const ex=next.find(g=>(inc.steam&&g.steam&&String(g.steam)===String(inc.steam)) || (inc.xbox&&g.xbox&&g.xbox===inc.xbox) || norm(g.title)===norm(inc.title));

        ['steam','xbox','lastPlayed','year'].forEach(k=>{ if(inc[k] && !ex[k]) ex[k]=inc[k]; });

        if(!ex.img && !ex.steam && inc.img) ex.img=inc.img;
        (inc.tags||[]).forEach(t=>{ ex.tags=ex.tags||[]; if(!ex.tags.includes(t)) ex.tags.push(t); });
        ex.updatedAt=ex.updatedAt||Date.now(); touched.push(ex); updated++;

        next.push(g); touched.push(g); added++;
      }
    }
    msg.textContent=`Saving ${touched.length} games…`;
    const ok=await commit(()=>{ S.games=next; return ()=>writeGames(touched); }, `Imported: ${added} new, ${updated} updated`);
    msg.textContent= ok ? `Done: ${added} new games, ${updated} updated.` : 'Import failed. Nothing was changed.';
  });
}

  const pool=nextPool(); if(!pool.length) return;
  let c=pool.filter(g=>g.id!==S.pickId); if(!c.length) c=pool;
  const w=c.map(g=>(+g.priority||2)**2); let r=Math.random()*w.reduce((a,b)=>a+b,0);
  let pick=c[0]; for(let i=0;i<c.length;i++){ r-=w[i]; if(r<=0){pick=c[i];break;} }
  S.pickId=pick.id; render(); $('#pickPanel')?.classList.add('rolling');
}

/* ============ rapid rating ============ */
const RATE={list:[], i:0, done:0};
function rateMode(){
  RATE.list=S.games.filter(g=>(g.rating==null||g.rating==='') && !['backlog','wishlist'].includes(g.status))
    .sort((a,b)=>totalHours(b)-totalHours(a) || (b.lastPlayed||'').localeCompare(a.lastPlayed||''));
  RATE.i=0; RATE.done=0; rateStep();
}
function rateStep(){
  const g=RATE.list[RATE.i], n=RATE.list.length;
  if(!g){
    openDlg(`<div class="dlg"><div class="dlg-head"><h2>All caught up</h2><button class="btn ghost sm" data-close>Close</button></div>
      <div class="dlg-body"><p style="margin:0">You rated ${RATE.done} game${RATE.done===1?'':'s'} this round. ${n-RATE.done>0?`${n-RATE.done} skipped.`:''}</p></div></div>`);
    return;
  }
  const cur=byId(g.id)||g, h=totalHours(cur);
  const sts=[['played','Played'],['beaten','Beaten'],['completed','100%'],['shelved','Shelved'],['abandoned','Dropped']];
  openDlg(`<div class="dlg rate-dlg">
    <div class="dlg-head"><h2>Rate your games</h2><span class="num" style="color:var(--muted);font-size:13px">${RATE.i+1} / ${n}</span><button class="btn ghost sm" data-close>Done</button></div>
    <div class="dlg-body rate-body">
      <div class="rate-cover">${cover(cur,"",true)}</div>
      <div class="rate-info">
        <h3>${esc(cur.title)}</h3>
        <div class="kv">${cur.platform?`<span>${esc(cur.platform)}</span>`:''}${h?`<span class="num">${fmtH(h)} played</span>`:''}${cur.lastPlayed?`<span>Last played ${esc(fmtDate(cur.lastPlayed))}</span>`:''}</div>
        <div class="rater big" role="group" aria-label="Rating">${Array.from({length:10},(_,i)=>i+1).map(v=>`<button class="half ${v%2?'l':'r'}" data-rrate="${v}" aria-label="${v/2} stars"><span>★</span></button>`).join('')}</div>
        <input class="input" id="quicktake" maxlength="280" placeholder="Quick take (optional), saved with your rating" value="${esc(cur.review||'')}" autocomplete="off">
        <div class="chips" role="group" aria-label="Status">${sts.map(([k,l])=>`<button class="chip" data-rstatus="${k}" aria-pressed="${cur.status===k}">${l}</button>`).join('')}</div>
        <p class="hint" style="margin:0;color:var(--muted);font-size:13px">Tap the stars to rate and move on. Type a quick take first if you want. Keys 1 to 5 rate, → skips, ← goes back.</p>
      </div>
    </div>
    <div class="dlg-foot"><button class="btn ghost" data-act="rback" ${RATE.i?'':'disabled'}>Back</button><span class="spacer"></span><button class="btn" data-act="rskip">Skip</button></div>
  </div>`);
}
document.addEventListener('keydown', e=>{
  if(!dlg.open || !dlg.querySelector('.rate-dlg') || e.target.closest?.('input,textarea')) return;
  if(/^[1-5]$/.test(e.key)){ e.preventDefault(); dlg.querySelector(`[data-rrate="${(+e.key)*2}"]`)?.click(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); RATE.i++; rateStep(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); RATE.i=Math.max(0,RATE.i-1); rateStep(); }
});
window.addEventListener('hashchange',()=>{ const t=location.hash.slice(1); if(t.startsWith('g-')){ if(!dlg.open) detail(t.slice(2)); return; } if(TABS.some(x=>x.k===t) && S.tab!==t){ S.tab=t; render(); } });

/* ============ tier list image ============ */
function loadImg(src){
  return new Promise(res=>{
    if(!src) return res(null);
    const im=new Image(); if(!src.startsWith('data:')) im.crossOrigin='anonymous';
    let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    im.onload=()=>fin(im); im.onerror=()=>fin(null); setTimeout(()=>fin(null),8000);
    im.src=src;
  });
}
function roundRect(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
async function exportTiers(){
  const rows=tierRows(VG()).filter(r=>r.gs.length); if(!rows.length){ toast('Rank some games first'); return; }
  toast('Building your image…');
  try{ await document.fonts?.ready; }catch(_){}
  const W=1200, PAD=28, LBL=96, CW=92, CH=138, GAP=8, per=Math.floor((W-PAD*2-LBL-GAP)/(CW+GAP));
  const HEAD=120, FOOT=56;
  const rowH=rows.map(r=>Math.ceil(r.gs.length/per)*(CH+GAP)+GAP);
  const H=HEAD+rowH.reduce((a,b)=>a+b+6,0)+FOOT;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#0E1015'; x.fillRect(0,0,W,H);
  x.fillStyle='#E9EBF1'; x.font='700 44px "Chakra Petch", system-ui, sans-serif'; x.textBaseline='alphabetic';
  x.fillText(`${S.profile.name||'My'}'s tier list`, PAD, 72);
  x.fillStyle='#A3A8B6'; x.font='500 20px "Figtree", system-ui, sans-serif';
  const n=rows.reduce((a,r)=>a+r.gs.length,0); x.fillText(`${n} games ranked`, PAD, 102);
  const all=rows.flatMap(r=>r.gs); const imgs={};
  await Promise.all(all.map(async g=>{ const cs=coverSrc(g); let im=cs?await loadImg(cs.src):null; for(const f of (cs?.fb||'').split('|').filter(Boolean)){ if(im) break; im=await loadImg(f); } imgs[g.id]=im; }));
  let y=HEAD;
  rows.forEach((r,ri)=>{
    const h=rowH[ri];
    x.fillStyle='#161920'; x.fillRect(PAD,y,W-PAD*2,h);
    x.fillStyle=r.c; x.fillRect(PAD,y,LBL,h);
    x.fillStyle='#16181d'; x.font='700 48px "Chakra Petch", system-ui, sans-serif'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText(r.t, PAD+LBL/2, y+h/2); x.textAlign='left'; x.textBaseline='alphabetic';
    r.gs.forEach((g,i)=>{
      const col=i%per, line=Math.floor(i/per), X=PAD+LBL+GAP+col*(CW+GAP), Y=y+GAP+line*(CH+GAP);
      x.save(); roundRect(x,X,Y,CW,CH,6); x.clip();
      const im=imgs[g.id];
      if(im){ const s=Math.max(CW/im.naturalWidth,CH/im.naturalHeight), w=im.naturalWidth*s, hh=im.naturalHeight*s; x.drawImage(im,X+(CW-w)/2,Y+(CH-hh)/2,w,hh); }
      else { const hu=hue(g.title), gr=x.createLinearGradient(X,Y,X,Y+CH); gr.addColorStop(0,`hsl(${hu} 58% 44%)`); gr.addColorStop(1,`hsl(${hu+30} 62% 18%)`); x.fillStyle=gr; x.fillRect(X,Y,CW,CH);
        x.fillStyle='#fff'; x.font='700 13px "Chakra Petch", system-ui, sans-serif';
        const words=g.title.split(/\s+/); let line2='', ly=Y+CH-10; const lines=[];
        const fit=w=>{ const out=[]; let cur=''; for(const ch of w){ if(x.measureText(cur+ch).width>CW-12){ out.push(cur); cur=ch; } else cur+=ch; } if(cur) out.push(cur); return out; };
        words.flatMap(fit).forEach(w=>{ const t=line2?line2+' '+w:w; if(x.measureText(t).width>CW-12){ if(line2) lines.push(line2); line2=w; } else line2=t; }); if(line2) lines.push(line2);
        lines.slice(-4).reverse().forEach((t,k)=>x.fillText(t,X+6,ly-k*15)); }
      x.restore();
    });
    y+=h+6;
  });
  x.fillStyle='#7D95FF'; x.font='600 22px "Chakra Petch", system-ui, sans-serif'; x.fillText(location.host||'Save File', PAD, H-22);
  x.fillStyle='#737988'; x.font='500 16px "Figtree", system-ui, sans-serif'; x.textAlign='right'; x.fillText('Made with Save File', W-PAD, H-22); x.textAlign='left';
  let blob; try{ blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png')); }catch(_){ toast('Could not build the image. Try again in a moment.'); return; }
  const file=new File([blob],'tier-list.png',{type:'image/png'});
  if(navigator.canShare?.({files:[file]}) && matchMedia('(pointer:coarse)').matches){
    try{ await navigator.share({files:[file], title:'My tier list'}); return; }catch(e){ if(e?.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tier-list.png'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800); toast('Saved tier-list.png');
}
/* ============ theme ============ */
function applyTheme(){
  let t=null; try{ t=localStorage.getItem('sf.theme'); }catch(_){}
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const b=document.getElementById('themeBtn'); if(b) b.textContent = dark ? '☀ Light' : '☾ Dark';
}
document.getElementById('themeBtn')?.addEventListener('click',()=>{
  const dark = document.documentElement.getAttribute('data-theme') ? document.documentElement.getAttribute('data-theme')==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  try{ localStorage.setItem('sf.theme', dark?'light':'dark'); }catch(_){}
  applyTheme();
});
applyTheme();
/* ============ favorites picker ============ */
function favPicker(slot){
  S.favSlot=+slot||1;
  const slots=[1,2,3,4].map(n=>S.games.find(g=>+g.top===n));
  const q=(S.favQ||'').trim().toLowerCase();
  const pool=S.games.filter(g=>!q || g.title.toLowerCase().includes(q)).sort((a,b)=>(+b.rating||0)-(+a.rating||0) || totalHours(b)-totalHours(a)).slice(0,30);
  openDlg(`<div class="dlg">
    <div class="dlg-head"><h2>Favorite games</h2><button class="btn ghost sm" data-close>Done</button></div>
    <div class="dlg-body">
      <div class="fav-slots">${slots.map((g,i)=>`<button class="fav-slot${S.favSlot===i+1?' on':''}" data-favpick-slot="${i+1}" aria-pressed="${S.favSlot===i+1}">
          ${g?cover(g,i+1):`<div class="slot-empty">Slot ${i+1}</div>`}</button>`).join('')}</div>
      <p style="margin:0;color:var(--muted);font-size:14px">Choosing for <b>slot ${S.favSlot}</b>. Tap a game below to put it there.${slots[S.favSlot-1]?` <button class="btn ghost sm" data-favclear="${S.favSlot}">Clear slot</button>`:''}</p>
      <input class="input" id="favq" type="search" placeholder="Search your games" value="${esc(S.favQ||'')}" autocomplete="off">
      <div class="fav-grid">${pool.map(g=>`<button class="card" data-favpick="${esc(g.id)}">${cover(g)}<span class="card-name">${esc(g.title)}</span></button>`).join('')||'<span class="hint">No games match.</span>'}</div>
    </div></div>`);
  setTimeout(()=>{ const f=$('#favq'); if(f && S.favQ){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } },20);
}
async function favSet(id, slot){
  const g=byId(id); if(!g) return;
  const ok=await saveGame({...g, top:slot, updatedAt:Date.now()}, `${g.title} is favorite #${slot}`);
  if(ok){ S.favQ=''; const next=[1,2,3,4].find(n=>!S.games.some(x=>+x.top===n)); favPicker(next||slot); }
}
/* ============ boot ============ */
render();
(async()=>{
  if(sb){
    const {data}=await sb.auth.getSession(); S.session=data.session||null;
    sb.auth.onAuthStateChange((_e,session)=>{ S.session=session||null; render(); });
  }
  load();
})();
})();
</script>
